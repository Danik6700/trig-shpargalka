<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Тригонометрия к зачёту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: одна колонка-тетрадь, липкая панель с разделами и кнопкой «проверь себя»; формулы — строки «лево = право», памятки — жёлтые стикеры */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --ink:#17202d; --muted:#5a6578; --line:#d8deea;
  --accent:#0d7a76; --accent-soft:#e1f2f1; --mark:#ffe36b; --mark-ink:#17202d;
  --memo-bg:#fff6d8; --memo-line:#f0d27a; --bad:#c2410c;
  --f-head:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"Noto Serif","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#17202a; --ink:#e5eaf2; --muted:#9aa6b9; --line:#2a3544;
  --accent:#4cc4bc; --accent-soft:#16312f; --mark:#5c4d10; --mark-ink:#fff4c2;
  --memo-bg:#2a2412; --memo-line:#5a4a1c; --bad:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#17202a; --ink:#e5eaf2; --muted:#9aa6b9; --line:#2a3544;
  --accent:#4cc4bc; --accent-soft:#16312f; --mark:#5c4d10; --mark-ink:#fff4c2;
  --memo-bg:#2a2412; --memo-line:#5a4a1c; --bad:#fb923c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.15;margin:.3em 0 .35em;text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin:0}
.secret{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.secret b{color:var(--accent)}
.secret .tag{font-family:var(--f-head);font-size:12px;background:var(--accent);color:var(--surface);padding:4px 8px;border-radius:6px;white-space:nowrap}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:8px}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--ink);font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.nav a:hover,.nav a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
button{font:inherit;cursor:pointer}
.quiz-btn{flex:none;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.quiz-btn[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.quiz-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar .quiz-hint{display:none;font-size:13px;color:var(--muted);padding-block:0 8px}
body.quiz .bar .quiz-hint{display:block}

/* sections */
section{padding-block:30px 6px;scroll-margin-top:70px}
h2{font-family:var(--f-head);font-weight:500;font-size:22px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;text-wrap:balance}
h2 .par{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
h3{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 14px;max-width:65ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0}
.f{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;padding:10px 16px;border-top:1px solid var(--line);font-family:var(--f-math);font-size:19px;line-height:1.3;overflow-x:auto}
.card .f:first-child{border-top:0}
.f .no{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:auto;padding-left:8px}
.f.key .l,.f.key .r{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 4px}
.f .note{font-family:var(--f-body);font-size:13px;color:var(--muted);flex-basis:100%}
.r{transition:filter .15s}
body.quiz .r{filter:blur(7px);cursor:pointer;user-select:none}
body.quiz .r.shown{filter:none}
@media (prefers-reduced-motion:reduce){.r{transition:none}}

.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.86em}
.fr>span{padding:0 .2em;line-height:1.25}
.fr>span:first-child{border-bottom:1.4px solid currentColor}
.sq{white-space:nowrap}
.sq>span{border-top:1.4px solid currentColor;padding:2px .15em 0;margin-left:1px}

.memo{margin-top:12px;background:var(--memo-bg);border:1px solid var(--memo-line);border-radius:12px;padding:12px 16px}
.memo .t{font-family:var(--f-head);font-size:13px;margin-bottom:4px}
.memo p{margin:.35em 0}
.memo ul,.memo ol{margin:.35em 0;padding-left:1.25em}
.memo li{margin:.2em 0}
.m{font-family:var(--f-math);white-space:nowrap}
.chant{font-family:var(--f-head);font-size:14px;letter-spacing:.02em;color:var(--accent)}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-family:var(--f-math);font-size:16px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
th small{display:block;font-family:var(--f-math);font-size:14px;color:var(--ink);font-weight:400}
td:first-child,th:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface)}
td.neg{color:var(--bad)}
body.quiz td.r{filter:blur(6px)}
body.quiz td.r.shown{filter:none}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>*{min-width:0}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.quad{display:flex;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.quad svg{width:100%;max-width:300px;height:auto}

details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:600}
details .ans{font-family:var(--f-math);font-size:17px;margin-top:8px;overflow-x:auto}

.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.chain span{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:4px 8px;font-family:var(--f-math)}
.chain i{color:var(--muted);font-style:normal}
.plan{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.plan li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px}
.plan li::before{counter-increment:s;content:counter(s);font-family:var(--f-head);color:var(--accent);min-width:1.2em}
.plan .time{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;padding-left:8px}
footer{color:var(--muted);font-size:13px;padding-block:30px 40px}

/* ---- экран с кодовой фразой ---- */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html:has(.gate:not([hidden])){overflow:hidden}
.gate-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:grid;gap:12px}
.gate-box .eyebrow{margin:0}
.gate-box h2{font-size:21px;margin:0}
.gate-box p{margin:0;color:var(--muted);font-size:14px}
.gate-box input{font:inherit;font-size:17px;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.gate-box input:focus{outline:none;border-color:var(--accent)}
.gate-box button{min-height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--surface);font-size:16px;font-weight:600}
.gate-box button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gate-err{color:var(--bad)!important;min-height:1.4em}
.gate-box.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.gate-box.shake{animation:none}}

html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.alt{display:inline-block}
.r{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.nav a.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.swipe{display:none;font-size:12px;color:var(--muted);margin:0 0 6px}
.dock{display:none}

/* ---- телефон ---- */
@media (max-width:640px){
  body{font-size:15.5px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  header.top{padding-block:20px 12px}
  h1{font-size:25px}
  .secret{flex-direction:column;gap:8px;padding:12px 14px}
  .m{white-space:normal}
  #quizBtn{display:none}
  body.quiz .bar .quiz-hint{display:none}
  .bar .wrap{padding-block:8px}
  .nav a{padding:8px 13px;font-size:14px}
  section{padding-block:24px 4px;scroll-margin-top:62px}
  h2{font-size:19px;flex-wrap:wrap;gap:2px 10px}
  h3{margin-top:18px}
  .card{border-radius:10px}
  .f{font-size:18px;padding:12px 14px;row-gap:.45em}
  .f .no{order:-1;flex-basis:100%;margin-left:0;padding-left:0;font-size:11px;line-height:1.2}
  .memo{padding:12px 14px}
  .memo ul,.memo ol{padding-left:1.1em}
  .chant{font-size:13.5px;line-height:1.7}
  .swipe{display:block}
  table{font-size:15px}
  th,td{padding:8px 9px}
  .quad svg{max-width:260px}
  details{padding:12px 14px}
  summary{padding-block:4px}
  .chain{font-size:13px}
  .plan li{flex-wrap:wrap;gap:4px 12px}
  .plan .time{margin-left:calc(1.2em + 12px);padding-left:0;flex-basis:100%}
  .dock{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock button{flex:1;min-height:46px;border-radius:12px;font-size:15px;font-weight:600;border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
  .dock .js-quiz[aria-pressed="false"],.dock .js-quiz[aria-pressed="true"]{flex:1.3}
  .dock .js-quiz[aria-pressed="false"]{background:var(--accent);color:var(--surface)}
  .dock .up{flex:0 0 46px;font-size:20px}
}
</style>
</head>
<body>

    <button type="submit">Открыть</button>
    <p class="gate-err" id="gateErr" aria-live="polite"></p>

</div>

<script>
(function(){
  var gate=document.getElementById('gate'),form=document.getElementById('gateForm'),
      input=document.getElementById('gateInput'),err=document.getElementById('gateErr'),
      btn=form.querySelector('button');
  var P=JSON.parse(document.getElementById('payload').textContent);
  var MARK='<!--ok-->';
  function norm(t){return t.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim()}
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  function unlock(phrase){
    var e=new TextEncoder();
    return crypto.subtle.importKey('raw',e.encode(phrase),'PBKDF2',false,['deriveKey'])
      .then(function(b){return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},b,{name:'AES-CBC',length:256},false,['decrypt'])})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-CBC',iv:u8(P.iv)},k,u8(P.ct))})
      .then(function(buf){
        var html=new TextDecoder().decode(buf);
        if(html.indexOf(MARK)!==0)throw new Error('bad');
        document.getElementById('app').innerHTML=html.slice(MARK.length);
        gate.hidden=true;
        try{localStorage.setItem('trigKey',phrase)}catch(x){}
        initApp();
      });
  }
  if(!window.crypto||!crypto.subtle){err.textContent='Открой ссылку в Chrome или Safari.';btn.disabled=true;return}
  try{var saved=localStorage.getItem('trigKey');if(saved)unlock(saved).catch(function(){try{localStorage.removeItem('trigKey')}catch(x){}})}catch(x){}
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    btn.disabled=true;btn.textContent='Открываю…';err.textContent='';
    unlock(norm(input.value)).catch(function(){
      err.textContent='Не та фраза. Спроси у Даника.';
      form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
      input.select();
    }).then(function(){btn.disabled=false;btn.textContent='Открыть'});
  });
})();
function initApp(){
  var body=document.body;
  var quizBtns=document.querySelectorAll('.js-quiz');
  var revealBtns=document.querySelectorAll('.js-reveal');
  function setReveal(all){
    document.querySelectorAll('.r').forEach(function(el){el.classList.toggle('shown',all)});
    revealBtns.forEach(function(b){b.textContent=all?'Спрятать все':'Показать все';b.dataset.all=all?'1':'0'});
  }
  function setQuiz(on){
    body.classList.toggle('quiz',on);
    quizBtns.forEach(function(b){b.setAttribute('aria-pressed',on?'true':'false');b.textContent=on?b.dataset.on:b.dataset.off});
    revealBtns.forEach(function(b){if(b.id==='revealDock')b.hidden=!on});
    setReveal(false);
    try{localStorage.setItem('trigQuiz',on?'1':'0')}catch(e){}
  }
  quizBtns.forEach(function(b){b.addEventListener('click',function(){setQuiz(!body.classList.contains('quiz'))})});
  revealBtns.forEach(function(b){b.addEventListener('click',function(){setReveal(b.dataset.all!=='1')})});
  document.getElementById('upDock').addEventListener('click',function(){window.scrollTo({top:0})});
  document.addEventListener('click',function(e){
    if(!body.classList.contains('quiz'))return;
    var r=e.target.closest('.r'); if(r) r.classList.toggle('shown');
  });
  try{if(localStorage.getItem('trigQuiz')==='1')setQuiz(true)}catch(e){}

  /* подсветка текущего раздела в меню */
  var nav=document.querySelector('.nav');
  var links={};
  nav.querySelectorAll('a').forEach(function(a){links[a.getAttribute('href').slice(1)]=a});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting)return;
        var a=links[en.target.id]; if(!a)return;
        nav.querySelectorAll('a.on').forEach(function(x){x.classList.remove('on')});
        a.classList.add('on');
        nav.scrollTo({left:a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2,behavior:'smooth'});
      });
    },{rootMargin:'-35% 0px -60% 0px'});
    document.querySelectorAll('main section[id]').forEach(function(s){io.observe(s)});
  }
}
</script>
</body>
